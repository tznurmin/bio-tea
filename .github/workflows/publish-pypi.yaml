name: Publish taxonomic-entity-augmentation to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release version
        run: |
          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/bio-tea/pyproject.toml").read_text())["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          grep -qx "__version__ = \"${package_version}\"" packages/bio-tea/src/bio_tea/__init__.py
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist packages/bio-tea
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/taxonomic-entity-augmentation
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
